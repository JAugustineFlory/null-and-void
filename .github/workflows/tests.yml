name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import project
        # Godot 4.7.1 can segfault while exiting after a first-time headless import
        # (only with a GDExtension loaded; the editor itself is fine). The import has
        # finished by then, so run it again and require the second pass to succeed.
        run: |
          godot --headless --import || true
          godot --headless --import
      - name: Run tests
        run: godot --headless -s tests/run_tests.gd
